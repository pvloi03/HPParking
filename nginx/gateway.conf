upstream frontend_service {
    server web:80;
}

upstream backend_service {
    server api:5051;
}

server {
    listen 80;
    server_name localhost;

    # Cho phép tải lên file ảnh và Excel tối đa 50MB
    client_max_body_size 50M;

    # Kích hoạt tính năng Zero-Copy ở mức Kernel của Linux
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ==============================================================
    # 1. ĐỌC ẢNH VÀ TÀI NGUYÊN TĨNH TRỰC TIẾP TỪ STORAGE (OFFLOAD KHỎI API)
    # ==============================================================

    # 1.1. Thư mục ảnh chụp biển số & toàn cảnh làn xe (Captures)
    location ~* ^/captures/(.*)$ {
        alias /data/storage/Captures/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files "" =404;
    }

    # 1.2. Thư mục ảnh đại diện khách hàng & FaceID (Avatar)
    location ~* ^/avatar/(.*)$ {
        alias /data/storage/Avatar/$1;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
        try_files "" =404;
    }

    # 1.4. Đường dẫn chung /images/...
    location /images/ {
        alias /data/storage/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # ==============================================================
    # 2. CHUYỂN TIẾP REST API SANG BACKEND .NET KESTREL
    # ==============================================================
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ==============================================================
    # 2.1. CHUYỂN TIẾP SWAGGER UI SANG BACKEND .NET KESTREL
    # ==============================================================
    location /swagger {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================================================
    # 3. CHUYỂN TIẾP GIAO DIỆN REACT WEB ADMIN
    # ==============================================================
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
